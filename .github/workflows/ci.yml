name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      # origami-common is a sibling git dependency (not on PyPI), so pip cannot
      # resolve it from the index — install it from GitHub first, then the
      # editable install of this package plus its test extra.
      - name: Install origami-common (git dependency)
        run: pip install git+https://github.com/smarks/origami-common.git@main

      - name: Install
        run: pip install -e .[test]

      - name: Run tests
        run: pytest -q

  notify:
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Email on failure or green-after-red
        uses: smarks/base_repo_template/.github/actions/notify@main
        with:
          job-status: ${{ needs.test.result }}
          mail-password: ${{ secrets.MAIL_PASSWORD }}
