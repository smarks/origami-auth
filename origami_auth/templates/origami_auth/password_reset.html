{% extends "origami_auth/base.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
<h1>Reset password</h1>
<p>Enter your account's email address and we'll send a reset link.</p>
<form method="post">{% csrf_token %}{{ form.as_p }}
  <button type="submit">Send reset link</button>
</form>
<p><a href="{% url 'origami_auth:login' %}">Back to log in</a></p>
{% endblock %}
